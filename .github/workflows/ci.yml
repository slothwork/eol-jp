name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build and SEO validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Emit generated package-lock
        run: |
          echo "PACKAGE_LOCK_BASE64_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "PACKAGE_LOCK_BASE64_END"

      - name: Astro check
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://eol.slothwright.com

      - name: SEO validation
        run: npm run validate:seo
