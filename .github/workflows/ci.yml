name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide validation scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          run_full=true
          changed_files=""

          if [[ -n "$base_sha" && -n "$head_sha" && ! "$base_sha" =~ ^0+$ ]]; then
            if changed_files="$(git diff --no-renames --name-only "$base_sha" "$head_sha")"; then
              if [[ -n "$changed_files" ]]; then
                run_full=false
                while IFS= read -r file; do
                  if [[ "$file" == docs/* ]] || [[ "$file" != */* && "$file" == *.md ]]; then
                    continue
                  fi

                  run_full=true
                  break
                done <<< "$changed_files"
              fi
            fi
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

          {
            echo "### CI validation scope"
            if [[ -n "$changed_files" ]]; then
              echo '```text'
              printf '%s\n' "$changed_files"
              echo '```'
            else
              echo "変更ファイルを安全に判定できなかったため、フルCIを実行します。"
            fi

            if [[ "$run_full" == "true" ]]; then
              echo "フルCIを実行します。"
            else
              echo "リポジトリ直下のMarkdownと docs/ 配下だけの変更のため、重いbuild / browser smoke等を省略します。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Check, build and SEO validate
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: EOL sync syntax check
        run: node --check scripts/sync-eol.mjs

      - name: Attention sync syntax check
        run: node --check scripts/sync-eol-attention.mjs

      - name: Snapshot freshness tests
        run: npm run test:snapshot-freshness

      - name: Snapshot freshness check
        run: npm run check:snapshot-freshness

      - name: Manual review freshness tests
        run: npm run test:manual-review-freshness

      - name: Manual review freshness check
        run: npm run check:manual-review-freshness

      - name: Attention ranking tests
        run: npm run test:attention

      - name: EOL decision tests
        run: npm run test:eol-decisions

      - name: Latest release tests
        run: npm run test:latest-releases

      - name: Search Console analysis tests
        run: npm run test:gsc-analysis

      - name: Tracked product storage tests
        run: npm run test:tracked-products

      - name: My EOL backup tests
        run: npm run test:my-eol-backup

      - name: View history tests
        run: npm run test:view-history

      - name: GitHub import tests
        run: npm run test:github-import

      - name: EOL reminder tests
        run: npm run test:eol-reminders

      - name: External notification tests
        run: npm run test:external-notifications

      - name: External notification client tests
        run: npm run test:external-notification-client

      - name: Email notification tests
        run: npm run test:email-notifications

      - name: Email notification client tests
        run: npm run test:email-notification-client

      - name: Public API tests
        run: npm run test:public-api

      - name: Worker runtime routing tests
        run: npm run test:worker-runtime-routing

      - name: JST date boundary tests
        run: npm run test:date-boundary

      - name: Official source review tests
        run: npm run test:official-source-reviews

      - name: Product content tests
        run: npm run test:product-content

      - name: EOL audit log tests
        run: npm run test:eol-audit

      - name: Responsive shell tests
        run: npm run test:responsive-shell

      - name: UX layout improvement tests
        run: npm run test:ux-layout-improvements

      - name: Performance budget utility tests
        run: npm run test:performance-budget

      - name: Astro check
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://eol.slothwright.com

      - name: Sitemap validation
        run: npm run test:sitemap

      - name: Release pagination tests
        run: npm run test:release-pagination

      - name: Security header tests
        run: npm run test:security-headers

      - name: Performance budget check
        run: npm run check:performance-budget

      - name: Release pagination browser smoke
        run: npm run test:release-pagination-browser

      - name: Dense table browser smoke
        run: npm run test:dense-tables-browser

      - name: Browser smoke tests
        run: npm run test:browser-smoke

      - name: SEO validation
        run: npm run validate:seo
