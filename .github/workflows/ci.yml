name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check, build and SEO validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Attention sync syntax check
        run: node --check scripts/sync-eol-attention.mjs

      - name: Attention ranking tests
        run: npm run test:attention

      - name: Astro check
        run: npm run check

      - name: Production build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://eol.slothwright.com

      - name: SEO validation
        run: npm run validate:seo
