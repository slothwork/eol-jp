name: Sync EOL data

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-eol-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch endoflife.date data
        run: node scripts/sync-eol.mjs

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- src/data/eol-snapshot.json src/data/change-log.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No EOL data changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push sync branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "eol-jp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/eol-data-sync
          git add src/data/eol-snapshot.json src/data/change-log.json
          git commit -m "chore(data): sync endoflife.date"
          git push --force origin HEAD:chore/eol-data-sync

      - name: Create pull request if needed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --base main --head chore/eol-data-sync --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing PR #$existing_pr"
            exit 0
          fi

          gh pr create \
            --base main \
            --head chore/eol-data-sync \
            --title "chore(data): sync endoflife.date" \
            --body "Automated EOL data refresh from endoflife.date. CI must pass before this PR is merged."
