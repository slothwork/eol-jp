name: Check manual review freshness

on:
  schedule:
    - cron: '35 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-manual-review-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Check manual review freshness
        run: npm run check:manual-review-freshness
