name: Check EOL snapshot freshness

on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-eol-snapshot-freshness
  cancel-in-progress: true

jobs:
  freshness:
    name: Check committed snapshot freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check snapshot freshness
        run: node --experimental-strip-types scripts/check-snapshot-freshness.mjs
